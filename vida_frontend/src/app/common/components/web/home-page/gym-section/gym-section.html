<section class="gym-section" id="centro-deportivo">
  <div class="gym-section__container">
    <div class="gym-section__text">
      <p class="gym-section__eyebrow">Centro Deportivo</p>
      <h2 class="gym-section__title">Entrena con un plan hecho para ti</h2>
      <p class="gym-section__description">
        Un espacio pensado para el entrenamiento personal: equipamiento moderno,
        acompañamiento cercano y planes adaptados a tu nivel y tus objetivos.
      </p>
      <a class="gym-section__cta" href="#">Descubre nuestros planes</a>
    </div>

    <div class="gym-section__media">
      <app-carousel [slides]="slides" />
    </div>
  </div>
</section>
